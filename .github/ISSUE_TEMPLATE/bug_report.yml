name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Diagnostic report (`clipcut doctor --report`)
      description: Run `clipcut doctor --report` (or click "Save bug report" in Settings → Setup) and attach or paste the contents of `clipcut-report-<date>.txt`. It contains doctor checks, tool versions, masked config, and recent logs with sensitive keys redacted.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and OS
      placeholder: clipcut 0.2.0, Ubuntu 24.04 x86_64
    validations:
      required: true
