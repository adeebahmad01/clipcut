[package]
name = "clipcut-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clipcut-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# resvg re-exports tiny-skia and usvg; we use those re-exports so only one
# tiny-skia ends up in the build. No text/system fonts: icons are pure paths.
resvg = { version = "0.48", default-features = false }
ab_glyph = "0.2.32"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
rayon = "1.10"
hound = "3.5"

[dev-dependencies]
chrono.workspace = true
